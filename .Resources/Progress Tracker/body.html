<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Super Mario Bros. Wii: New Horizons Progress Tracker</title>
<style>
body { background:#1e1e1e; color:white; font-family:Verdana; padding:20px; }
h1 { text-align:center; margin-bottom:10px; }
#progress { text-align:center; margin-bottom:10px; font-size:16px; }
#unsaved { text-align:center; font-weight:bold; }
#lastSaved { text-align:center; margin-bottom:15px; font-size:13px; color:#ccc; }
.unsaved { color:red; }
.saved { color:lightgreen; }
.category { margin-bottom:30px; }
.category h2 { border-bottom:2px solid #555; padding-bottom:5px; margin-bottom:15px; display:flex; justify-content:space-between; }
.world-counter { color:#aaa; }
.world-counter.complete { color:yellow; }
.level-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px; }
.level { background:#2a2a2a; border:2px solid #555; border-radius:12px; padding:10px; text-align:center; cursor:pointer; }
.level-name { font-size:14px; margin-bottom:8px; }
.star-coins { display:flex; justify-content:center; gap:4px; margin-bottom:5px; }
.star { width:20px; height:20px; opacity:0.3; }
.star.gold { opacity:1; background:gold; border-radius:50%; }
.star.purple { opacity:1; background:purple; border-radius:50%; }
.collab-btn { font-size:12px; padding:3px 6px; background:purple; color:white; border:none; border-radius:5px; cursor:pointer; }
#saveBtn,#resetBtn,#loadBtn { margin-top:20px; padding:10px; border:none; border-radius:8px; color:white; }
#saveBtn { background:green; }
#resetBtn { background:red; margin-left:10px; }
#loadBtn { background:#0077cc; margin-left:10px; }
</style>
</head>
<body>

<h1>New Super Mario Bros. Wii: New Horizons Progress Tracker</h1>

<div id="progress"></div>
<div id="unsaved" class="saved">🟢 All changes saved</div>
<div id="lastSaved">Last export: Never</div>

<label style="display:block; text-align:center; margin-bottom:10px;">
<input type="checkbox" id="mainToggle"> Show only main levels
</label>

<div id="categories"></div>

<button id="saveBtn">Download Updated levels.json</button>
<button id="resetBtn">Reset Progress</button>
<button id="loadBtn">Load levels.json</button>

<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
const STORAGE_KEY = "nsmbwii-progress";
let levelsData = [];
let hasUnsavedChanges = false;
let warnedThisSession = false;

// -------- Helpers --------
function isMainLevel(id){
  const n = parseInt(id.split('-')[1]);
  return (n >= 1 && n <= 9) || n === 22 || n === 24 || n === 38;
}

function setUnsaved(state){
  hasUnsavedChanges = state;
  const el = document.getElementById("unsaved");
  if(state){
    el.textContent = "🔴 Unsaved changes";
    el.className = "unsaved";
  } else {
    el.textContent = "🟢 All changes saved";
    el.className = "saved";
  }
}

window.addEventListener("beforeunload", function (e) {
  if (hasUnsavedChanges) {
    e.preventDefault();
    e.returnValue = '';
  }
});

function markChanged(){
  setUnsaved(true);

  if(!warnedThisSession){
    alert("⚠️ Don't forget to export your updated levels.json!");
    warnedThisSession = true;
  }
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(levelsData));
  markChanged();
}

function updateLastSaved(){
  const now = new Date();
  document.getElementById("lastSaved").textContent =
    "Last export: " + now.toLocaleString();
}

function updateProgress(){
  const totalAll = levelsData.length;
  const totalMain = levelsData.filter(l=>isMainLevel(l.id)).length;
  const doneAll = levelsData.filter(l=>l.completedBy).length;
  const doneMain = levelsData.filter(l=>l.completedBy && isMainLevel(l.id)).length;

  document.getElementById('progress').innerHTML =
    `Main: ${doneMain}/${totalMain} | All: ${doneAll}/${totalAll}`;
}

function updateWorldCounters(){
  const showMain = document.getElementById('mainToggle').checked;

  document.querySelectorAll('.category').forEach(cat=>{
    const levels = Array.from(cat.querySelectorAll('.level'))
      .filter(l=>!showMain || l.dataset.main==='true');

    const done = levels.filter(l=>l.dataset.completed).length;
    const counter = cat.querySelector('.world-counter');

    counter.textContent = `${done}/${levels.length}`;
    counter.classList.toggle('complete', done===levels.length && levels.length>0);
  });
}

function applyFilter(){
  const showMain = document.getElementById('mainToggle').checked;

  document.querySelectorAll('.level').forEach(level=>{
    level.style.display = (!showMain || level.dataset.main==='true') ? '' : 'none';
  });

  updateWorldCounters();
}

// -------- Render --------
function renderLevels(){
  const container = document.getElementById('categories');
  container.innerHTML = "";

  const categories = {};
  levelsData.forEach(l=>{
    if(!categories[l.category]) categories[l.category]=[];
    categories[l.category].push(l);
  });

  Object.keys(categories).forEach(name=>{
    const catDiv = document.createElement('div');
    catDiv.className='category';

    const h2 = document.createElement('h2');
    h2.textContent=name;

    const counter = document.createElement('span');
    counter.className='world-counter';
    h2.appendChild(counter);

    const grid = document.createElement('div');
    grid.className='level-grid';

    categories[name].forEach(level=>{
      const div = document.createElement('div');
      div.className='level';
      div.dataset.main = isMainLevel(level.id);
      div.dataset.completed = level.completedBy||'';

      const title = document.createElement('div');
      title.className='level-name';
      title.textContent = level.name;

      const stars = document.createElement('div');
      stars.className='star-coins';

      function renderStar(){
        stars.innerHTML='';
        for(let i=0;i<3;i++){
          const s=document.createElement('div');
          s.className='star';
          if(level.completedBy==='me') s.classList.add('gold');
          if(level.completedBy==='collab') s.classList.add('purple');
          stars.appendChild(s);
        }
      }

      renderStar();

      div.onclick = ()=>{
        level.completedBy = level.completedBy==='me'?null:'me';
        div.dataset.completed = level.completedBy||'';
        renderStar();
        updateProgress();
        updateWorldCounters();
        saveData();
      };

      const btn = document.createElement('button');
      btn.className='collab-btn';
      btn.textContent='Collaborator';

      btn.onclick = e => {
        e.stopPropagation();
        level.completedBy = level.completedBy==='collab'?null:'collab';
        div.dataset.completed = level.completedBy||'';
        renderStar();
        updateProgress();
        updateWorldCounters();
        saveData();
      };

      div.append(title, stars, btn);
      grid.appendChild(div);
    });

    catDiv.append(h2, grid);
    container.appendChild(catDiv);
  });

  updateProgress();
  updateWorldCounters();
}

// -------- Load JSON file --------
document.getElementById('loadBtn').onclick = ()=>{
  document.getElementById('fileInput').click();
};

document.getElementById('fileInput').addEventListener('change', function(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);

      if(confirm("Load this file and overwrite current progress?")){
        levelsData = data;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(levelsData));
        renderLevels();
        setUnsaved(false);
        warnedThisSession = false;
      }
    } catch(err){
      alert("Invalid JSON file!");
    }
  };

  reader.readAsText(file);
});

// -------- Load initial --------
function loadInitialData(){
  const local = localStorage.getItem(STORAGE_KEY);

  if(local){
    levelsData = JSON.parse(local);
    renderLevels();
  } else {
    fetch('levels.json')
      .then(r=>r.json())
      .then(data=>{
        levelsData = data;
        renderLevels();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(levelsData));
      });
  }
}

// -------- Buttons --------
document.getElementById('mainToggle').onchange = applyFilter;

document.getElementById('saveBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(levelsData,null,2)]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'levels.json';
  a.click();

  setUnsaved(false);
  updateLastSaved();
  warnedThisSession = false;
};

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm("Reset all progress?")){
    localStorage.removeItem(STORAGE_KEY);
    levelsData.forEach(l=>l.completedBy=null);
    renderLevels();
    saveData();
  }
};

// -------- Init --------
loadInitialData();
</script>

</body>
</html>
